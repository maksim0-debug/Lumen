name = "lumen-schedule-monitor"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Запуск Cron Triggers кожні 5 хвилин
[triggers]
crons = ["*/5 * * * *"]

# KV потрібне лише для одноразового імпорту стану попередньої версії Worker.
# Створіть через команду: wrangler kv:namespace create SCHEDULE_KV
# і підставте згенерований ID сюди:
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "0ad93b752db04aaabe5a3876c68e41ba"

[vars]
PROJECT_ID = "lumen-power"

[[durable_objects.bindings]]
name = "SCHEDULE_MONITOR"
class_name = "ScheduleMonitor"

[[migrations]]
tag = "schedule-monitor-v1"
new_sqlite_classes = ["ScheduleMonitor"]
